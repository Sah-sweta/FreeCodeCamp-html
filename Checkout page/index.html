<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="rubic cubes"></img>
        </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name">Name on the card<span type="text" aria-hidden="true">*</span></label>
            <input type="text" name="card-name" id="card-name" span="*" aria-hidden="true" required span="text" aria-hidden="true">

            <label for="card-number">Enter your Card Number<span type="text" aria-hidden="true">*</span></label>
            <input 
            type="text" 
            id="card-number" 
            name="card-number" 
            aria-describedby="card-number-help"
            required>
            
            <p
            id="card-number-help">Enter your card details
                </p>
            

            </form>

        </section>    

</body>

</html>
